# Local development defaults.
# On Render, environment variables (DB_URL, DB_USER, AI_PROVIDER, GROQ_API_KEY ...) override these values.
# Never put real passwords or API keys in this file - it is pushed to GitHub.

db.url=jdbc:mysql://localhost:3306/careerverse_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
db.user=root
db.password=

# Email. On Render use Brevo (brevo.api.key + mail.from). On a laptop Gmail SMTP also works.
brevo.api.key=
mail.from=
mail.from.name=CareerVerse AI
mail.host=smtp.gmail.com
mail.port=587
mail.username=
mail.password=

# AI chatbot: groq, gemini or ollama. Leave empty to pick automatically from the keys that are set.
ai.provider=
groq.api.key=
groq.model=llama-3.3-70b-versatile
gemini.api.key=
gemini.model=gemini-2.5-flash
ollama.url=http://localhost:11434
ollama.model=llama3.2
